<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Reviews - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
    <header class="navbar">
        <div class="logo">
            <span class="star-icon">★</span>
            <div class="logo-text">
                <span class="pro">PRO</span>
                <span class="reviews">REVIEWS</span>
            </div>
        </div>
        <div class="search-container">
            <input type="text" placeholder="🔎 Buscar jogos...">
        </div>
        <button class="button-entrar" onclick="Entrar()">Entrar</button>
    </header>

    <!-- BANNER PRINCIPAL ROXO -->
    <section class="hero-banner">
        <h1>Bem-vindo ao PROREVIEWS</h1>
        <p>descubra, avalie e compartilhe seus jogos favoritos</p>
    </section>

    <!-- BARRA DE FILTROS -->
    <section class="filter-bar">
        <div class="left-filters">
            <button class="filter-btn icon-btn">⏳</button>
            <select class="filter-select">
                <option>Todas as Plataformas</option>
            </select>
            <select class="filter-select">
                <option>Todos os Gêneros</option>
            </select>
        </div>
        <div class="right-filters">
            <select class="filter-select">
                <option>Maior Avaliação</option>
                <option>Menor Avaliação</option>
            </select>
        </div>
    </section>
    <script src="index.js"></script>

</body>
</html>
