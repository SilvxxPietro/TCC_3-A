<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PROREVIEWS</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container">

        <div class="logo">
            <span class="star">★</span>
            <h1>PROREVIEWS</h1>
        </div>

        <div class="card">

            <div class="forms">

                <!-- LOGIN -->
                <div class="form-box active" id="boxLogin">
                    <h2>Entrar</h2>

                    <form id="formLogin">
                        <input type="email" id="emailLogin" placeholder="Email" required>
                        <input type="password" id="senhaLogin" placeholder="Senha" required>

                        <button type="submit">Entrar</button>
                    </form>

                    <p id="mensagemLogin"></p>
                    <p class="toggle-text">Não tem uma conta? <a href="#" id="irParaCadastro">Cadastre-se</a></p>
                </div>

                <!-- CADASTRO -->
                <div class="form-box" id="boxCadastro">
                    <h2>Criar Conta</h2>

                    <form id="formCadastro">
                        <input type="text" id="nomeCadastro" placeholder="Nome" required>
                        <input type="email" id="emailCadastro" placeholder="Email" required>
                        <input type="password" id="senhaCadastro" placeholder="Senha" required>

                        <button type="submit">Cadastrar</button>
                    </form>

                    <p id="mensagemCadastro"></p>
                    <p class="toggle-text">Já tem uma conta? <a href="#" id="irParaLogin">Entre aqui</a></p>
                </div>

                <div class="form-box" id="boxPerfil">
                    <h2>Minha Conta</h2>
                    <div class="user-info">
                        <div class="avatar">👤</div>
                        <p id="nomeUsuarioPerfil">Nome do Usuário</p>
                        <p id="emailUsuarioPerfil" class="sub-text">usuario@email.com</p>
                    </div>
                    <button id="btnSair" class="btn-sair">Sair da Conta</button>
                </div>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
